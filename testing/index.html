body.view-home .community-home {
  font: 1rem/1.6 Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
}
body.view-home .home-identity {
  grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
  background: #e8e7df;
}
body.view-home .home-brand {
  padding: clamp(20px, 4vw, 48px);
  background: linear-gradient(105deg, #e2eeea, #e8e7df);
}
body.view-home .home-brand h1 {
  font-size: clamp(2rem, 3vw, 2.25rem);
  line-height: 1.25;
  letter-spacing: -.025em;
  text-wrap: balance;
}
body.view-home .home-identity .home-photo {
  width: 100%;
  height: clamp(240px, 24vw, 290px);
  object-fit: contain;
  object-position: center;
  background: linear-gradient(90deg, #e8e7df, #d2cec2);
}
body.view-home .community-home :is(.home-section-heading, .community-calendar > h2) {
  font-size: 1.25rem;
}
body.view-home .home-grid :is(.module-entry, h3) {
  font-size: 1.125rem;
  font-weight: 600;
}
footer.property-footer {
  display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
  width:100%; max-width:none; box-sizing:border-box; margin:20px 0 0;
  padding:18px max(18px,calc((100% - 1100px)/2));
  background: #e3ede9;
  color: #244741;
  border-top: 1px solid #c5d7d1;
  font: 400 .875rem/1.55 Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
}
.property-footer nav {display:flex;align-items:center;gap:18px}
.property-footer :is(a, button) {color: inherit; font: inherit}
.property-footer button {border-color: #a6bdb5}
@media (max-width:650px) {
  body.view-home .home-identity {grid-template-columns: minmax(0, 1fr) 33%}
  body.view-home .home-brand {padding: 16px; flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px}
  body.view-home .home-brand h1 {font-size: clamp(1.3rem, 5vw, 1.65rem)}
  body.view-home .home-identity .home-photo {height: 100%; min-height: 155px}
  footer.property-footer {align-items: flex-start; flex-direction: column; gap: 8px; text-align: left}
  .property-footer nav {flex-wrap: wrap; gap: 16px}
}
.accounts-dialog {box-sizing:border-box; overscroll-behavior:contain}
.accounts-dialog .account-heading, .accounts-dialog .account-actions {display:flex; align-items:center; justify-content:space-between; gap:12px}
.accounts-dialog .account-heading {margin-bottom:16px}
.accounts-dialog .account-heading h2,.accounts-dialog [data-list] p {margin:0}
.accounts-dialog [data-list] small {display:block; color:#4e6560}
.accounts-dialog [data-list] button {flex:none}
.accounts-dialog form:not([hidden]) {display:grid; gap:16px; padding-top:16px}
.accounts-dialog form :is(p,label) {margin:0}
.accounts-dialog .account-enabled {display:flex; align-items:center; gap:8px}
.accounts-dialog .account-enabled input {width:18px; height:18px; margin:0}
.accounts-dialog .account-actions {justify-content:flex-end; border-top:1px solid #d6e4df; padding-top:12px}

#app main > .login {
  width: min(100%, 480px);
  box-sizing: border-box;
  margin: 0;
  background: white;
}
#app main:has(> .login)::before {inset:50% auto auto 26%;transform:translate(-50%,-50%);width:min(52%, 66svh);aspect-ratio:3 / 4;mask-image:linear-gradient(to right,transparent,#000 16%,#000 82%,transparent),linear-gradient(to bottom,transparent,#000 16%,#000 93%,transparent);mask-composite:intersect}
@media(min-width:801px){#app main:has(> .login){padding-left:51%}}
@media(max-width:800px){#app main:has(> .login){padding-top:205px}#app main:has(> .login)::before{inset:5px auto auto 50%;transform:translateX(-50%);width:auto;height:190px}}
.registration-tools {display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.registration-tools .module-entry {flex:1}
dialog.registration-qr {width:min(90vw,38rem);max-height:90dvh;overflow:auto;text-align:center}
