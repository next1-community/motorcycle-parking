<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選位順位翻牌預覽</title><style>
*{box-sizing:border-box}body{margin:0;background:#101d37;color:#fff;font:18px Arial,"PingFang TC",sans-serif}main{max-width:1100px;margin:auto;padding:clamp(18px,4vw,54px)}header,footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}h1{font-size:clamp(24px,4vw,44px);margin:.4em 0}.tag{color:#ffe099}section{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,20px);margin:1.2em 0}.slot{perspective:850px;aspect-ratio:1.35;animation:deal .45s backwards;animation-delay:var(--deal)}.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:turn .6s ease-in-out forwards;animation-delay:var(--flip)}.side{position:absolute;inset:0;border-radius:12px;border:2px solid #d8b773;backface-visibility:hidden;display:grid;place-content:center;text-align:center;gap:.3em}.back{color:#f9d696;background:repeating-linear-gradient(45deg,transparent 0 12px,#ffffff07 12px 14px),#29496c;box-shadow:inset 0 0 0 5px #29496c,inset 0 0 0 6px #a48d65;font:bold clamp(16px,3vw,32px) Georgia;letter-spacing:.1em}.front{background:#fff4d9;color:#172e4b;transform:rotateY(180deg)}.front b{font-size:clamp(19px,3vw,38px)}.front small{font-weight:bold;font-size:clamp(13px,2vw,21px)}button{font:inherit;padding:.55em 1.1em;border-radius:8px;border:0;background:#ffdb85;color:#162b48;font-weight:bold}p{margin:0}@keyframes deal{from{opacity:0;transform:translate(-55px,-35px) rotate(-12deg) scale(.75)}}@keyframes turn{to{transform:rotateY(180deg)}}@media(max-width:540px){section{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){.slot{animation:none}.card{animation:none;transform:rotateY(180deg)}}
</style><main><header><div><small class="tag">NEXT1 社區 · 動畫預覽</small><h1>機車位選位順位</h1></div><span>示意戶別</span></header><section aria-label="順位卡"></section><footer><p role="status"></p><button type="button">重新播放</button></footer></main><script>
const sample=['217-5F','225-9F','219-7F','223-3F','215-6F','221-8F','225-9F','217-4F'];
const grid=document.querySelector('section'),statusText=document.querySelector('[role=status]');
let timers=[];
function play(){
 timers.forEach(clearTimeout);timers=[];
 grid.innerHTML=sample.map((unit,i)=>`<article class="slot" style="--deal:${i*.12}s;--flip:${1.65+i*.37}s"><div class="card"><div class="side back" aria-hidden="true">✦<br>NEXT1</div><div class="side front"><small>第 ${i+1} 順位</small><b>${unit}</b></div></div></article>`).join('');
 statusText.textContent='發牌中';
 timers.push(setTimeout(()=>statusText.textContent='依序揭曉',1650),setTimeout(()=>statusText.textContent='順位已公布',5000));
}
document.querySelector('button').onclick=play;play();
</script></html>
