<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選位順位翻牌預覽</title><link rel="stylesheet" href="./rank-reveal.css"><style>
*{box-sizing:border-box}body{margin:0;background:#101d37;color:#fff;font:18px Arial,"PingFang TC",sans-serif}main{max-width:1100px;margin:auto;padding:clamp(18px,4vw,54px)}header,footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}h1{font-size:clamp(24px,4vw,44px);margin:.4em 0}.tag{color:#ffe099}section.unused{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,20px);margin:1.2em 0}.slot{perspective:850px;aspect-ratio:1.35;animation:deal .45s backwards;animation-delay:var(--deal)}.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:turn .6s ease-in-out forwards;animation-delay:var(--flip)}.side{position:absolute;inset:0;border-radius:12px;border:2px solid #d8b773;backface-visibility:hidden;display:grid;place-content:center;text-align:center;gap:.3em}.back{color:#f9d696;background:repeating-linear-gradient(45deg,transparent 0 12px,#ffffff07 12px 14px),#29496c;box-shadow:inset 0 0 0 5px #29496c,inset 0 0 0 6px #a48d65;font:bold clamp(16px,3vw,32px) Georgia;letter-spacing:.1em}.front{background:#fff4d9;color:#172e4b;transform:rotateY(180deg)}.front b{font-size:clamp(19px,3vw,38px)}.front small{font-weight:bold;font-size:clamp(13px,2vw,21px)}button{font:inherit;padding:.55em 1.1em;border-radius:8px;border:0;background:#ffdb85;color:#162b48;font-weight:bold}p{margin:0}@keyframes deal{from{opacity:0;transform:translate(-55px,-35px) rotate(-12deg) scale(.75)}}@keyframes turn{to{transform:rotateY(180deg)}}@media(max-width:540px){section.unused{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){.slot{animation:none}.card{animation:none;transform:rotateY(180deg)}}
</style><main><header><div><small class="tag">NEXT1 社區 · 動畫預覽</small><h1>機車位選位順位</h1></div><span>示意戶別</span></header><div id="board"></div><footer><p>以 59 格車位示範，候補順序以現場選位結果為準。</p><button type="button">重新播放</button></footer></main><script type="module">
import {startReveal,revealPage} from './rank-reveal.js?v=10';
const units=Array.from({length:60},(_,i)=>[215,217,219,221,223,225][i%6]+'-'+(6+Math.floor(i/6))+'F');
units.push('225-9F','225-12F');
const lots=Array.from({length:62},(_,i)=>({rank:i+1,household:units[(i*17)%62]}));
function render(){
 document.querySelector('#board').innerHTML=revealPage() || '<h2>完整選位順位</h2><ol>'+lots.map(l=>'<li>'+l.household+(l.rank>59?'　預計候補第 '+(l.rank-59)+' 位':'')+'</li>').join('')+'</ol>';
}
function play(){startReveal(lots,render);render()}
document.querySelector('button').onclick=play;play();
</script>
