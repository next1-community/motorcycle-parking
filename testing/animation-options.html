<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽籤動畫選款</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#193347;font:18px Arial,"PingFang TC",sans-serif}main{max-width:880px;margin:auto;padding:4vw}nav{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}button{font:inherit;font-weight:bold;border:1px solid #475f70;border-radius:2em;background:white;padding:.6em 1em;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#193347;color:white}.stage{border-radius:24px;overflow:hidden;text-align:center;padding:2rem 1rem;color:#173346;background:var(--bg)}svg{display:block;width:min(100%,540px);margin:auto}.stage h2{margin:.6rem}footer{margin:1rem 0}svg *{transform-box:fill-box;transform-origin:center}.spin{animation:spin 3.4s ease-in-out both}.shake{animation:rock .28s ease-in-out 9 alternate}.slip{animation:lift 5s ease both}.prize{animation:prize 5s ease both}@keyframes spin{to{transform:rotate(1080deg)}}@keyframes rock{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}@keyframes lift{0%,49%{transform:translateY(28px);opacity:0}65%,100%{transform:translateY(-9px);opacity:1}}@keyframes prize{0%,64%{opacity:0;transform:translateY(-30px)}82%,100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){svg *{animation:none!important}}
</style><main><h1>抽籤動畫選款</h1><nav aria-label="選擇動畫"></nav><section class="stage"></section><footer><button id="again">重新播放</button></footer></main><script>
const outline='stroke="#23384a" stroke-width="4" stroke-linejoin="round"';
const ball=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="#23384a" stroke-width="3"/>`;
const balls=()=>['#e97e69','#f6ce57','#74beae','#a6a6d9','#f8ad72','#6cb4cb'].map((c,i)=>ball(178+Math.cos(i*Math.PI/3)*37,91+Math.sin(i*Math.PI/3)*37,15,c)).join('');
const choices=[
['安全帽小騎士','#e3f4ed',`<ellipse cx="193" cy="208" rx="116" ry="8" fill="#bbdacc"/><g ${outline}><path d="M104 204q3-66 61-66t64 66z" fill="#eba35d"/><path d="m128 151 22 30 39-29-10-13z" fill="#239a89"/><g class="shake"><rect x="107" y="61" width="117" height="88" rx="44" fill="#fbd7b2"/><path d="M98 99q-3-76 66-76t68 71l-24 5-4-19q-32 13-81 9l-2 24-19-1z" fill="#eb785f"/><path d="M148 26q12-4 24-1l10 51-23 4z" fill="#ffdf8c"/><path d="M111 83q59 2 99-13l22 6-8 10q-49 15-110 10z" fill="#d5ebe9"/><path d="M141 110q6-9 12 0m27 0q6-9 12 0m-34 16q9 9 17-1" fill="none" stroke-linecap="round"/></g><path d="m207 154 75 0-6 48h-62z" fill="#43869a"/><g class="slip"><rect x="243" y="92" width="17" height="64" rx="6" fill="#ffda71"/><path d="m187 166 49-39q10-8 19 2 4 7-5 14l-46 36z" fill="#fbd7b2"/></g></g>`],
['復古搖獎機','#f8ebd8',`<g ${outline}><path d="m121 191 21-71h76l20 71z" fill="#267c80"/><rect x="106" y="186" width="147" height="17" rx="6" fill="#245363"/><circle cx="178" cy="91" r="67" fill="#fff8dc"/><g class="spin">${balls()}<path d="M116 91h124m-62-62v124" fill="none" stroke="#c39a60"/></g><path d="M247 85h22v34h16" fill="none"/><circle cx="286" cy="119" r="9" fill="#ee815e"/><path d="m229 150 46 29h35" fill="none" stroke-width="8"/><g class="prize">${ball(295,166,13,'#ed8663')}</g></g>`],
['幸運扭蛋機','#eae7f6',`<g ${outline}><path d="M134 124h90l13 63q1 12-9 12H126q-8 0-7-11z" fill="#e68990"/><circle cx="178" cy="85" r="62" fill="#f8f5ff"/><g class="spin">${balls()}</g><path d="M139 30q39-21 78 0z" fill="#8976ad"/><rect x="130" y="136" width="49" height="43" rx="11" fill="#fff1cf"/><g class="spin"><rect x="137" y="153" width="35" height="9" rx="4" fill="#56687c"/></g><rect x="189" y="151" width="34" height="31" rx="8" fill="#465169"/><g class="prize">${ball(212,194,16,'#ffc85e')}<path d="M197 191q15 7 30 0" fill="none"/></g></g>`]
];let timer,selected=0;const nav=document.querySelector('nav'),stage=document.querySelector('.stage');function play(i){selected=i;clearTimeout(timer);[...nav.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i));const [name,bg,art]=choices[i];stage.style.setProperty('--bg',bg);stage.innerHTML='<svg aria-hidden="true" viewBox="0 0 360 228">'+art+'</svg><h2>正在抽出選位順位</h2>';timer=setTimeout(()=>stage.querySelector('h2').textContent='抽籤順位已公布',5000)}choices.forEach(([name],i)=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>play(i);nav.append(b)});again.onclick=()=>play(selected);play(0)
</script></html>
