<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>啟用帳號｜NEXT1 測試版</title><style>body{background:#edf4f1;color:#173934;font:1rem/1.6 system-ui;padding:5vh 1rem}main{background:white;max-width:28rem;margin:auto;padding:2rem;border-radius:1rem}input,button{box-sizing:border-box;width:100%;padding:.8rem;margin:.4rem 0 1rem;font:inherit}button{background:#165e54;color:white;border:0;border-radius:.5rem}</style><link rel="stylesheet" href="portal.css"><main><small>NEXT1 社區管理系統 · 測試版</small><h1>啟用管理帳號</h1><p role="status" id="notice"></p><form hidden><label>設定密碼<input type="password" autocomplete="new-password" minlength="12" required></label><label>再次輸入密碼<input type="password" autocomplete="new-password" minlength="12" required></label><button>設定密碼並啟用帳號</button></form><a hidden href="./#/home">前往管理中心登入</a></main><footer class="community-signature"><div><img width="28" height="28" src="../logo.jpg" alt=""><span>© <span id="year"></span> 勝輝 NEXT1 公寓大廈管理委員會</span></div></footer><script>document.querySelector("#year").textContent=new Date().getFullYear()</script><script type="module">
import {config} from './config.js';
const params=new URLSearchParams(location.hash.slice(1));let token=params.get('access_token');history.replaceState(null,'',location.pathname);
const form=document.querySelector('form'),notice=document.querySelector('#notice'),link=document.querySelector('a');
if(token && params.get('type')==='invite'){form.hidden=false;notice.textContent='請設定至少 12 碼的密碼。'}else{notice.textContent='請從邀請信中的啟用連結開啟此頁。'}
form.onsubmit=async e=>{e.preventDefault();const [p,q,b]=form.elements;if(p.value!==q.value){notice.textContent='兩次輸入的密碼不同。';return}b.disabled=true;try{const r=await fetch(config.url+'/auth/v1/user',{method:'PUT',headers:{apikey:config.key,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});if(!r.ok){notice.textContent='未能設定密碼，請確認連結仍有效，或聯絡系統管理員。';return}token=null;form.reset();form.hidden=true;link.hidden=false;notice.textContent='密碼已設定，請使用受邀信箱登入。'}catch{notice.textContent='連線失敗，請稍後再試。'}finally{b.disabled=false}};
</script></html>
